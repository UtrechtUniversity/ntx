x-web-env: &web-env
  DJANGO_DEBUG: "False"
  DJANGO_SECRET_KEY: "local-prod-test-insecure-key-change-in-production"
  DJANGO_SETTINGS_MODULE: "ntxconfig.settings.production"
  DATABASE_URL: "postgres://ntx_user:ntx_local_password@db:5432/ntx_dev"
  ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"

services:
  db:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_DB: ntx_dev
      POSTGRES_USER: ntx_user
      POSTGRES_PASSWORD: ntx_local_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ntx_user -d ntx_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Containerfile
      target: prod
    command: ["python", "manage.py", "migrate", "--noinput"]
    volumes:
      - media:/app/media
    environment: *web-env
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Containerfile
      target: prod
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    environment: *web-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  media:
