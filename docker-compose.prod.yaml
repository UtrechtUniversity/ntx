services:
  web:
    build:
      context: .
      dockerfile: Containerfile
      target: prod
    # The base service has local-development bind mounts. Reset them so the
    # production override tests the immutable image, including built static files.
    volumes: !reset []
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "local-prod-test-insecure-key-change-in-production"
      DJANGO_SETTINGS_MODULE: "ntxconfig.settings.production"
      DATABASE_URL: "postgres://ntx_user:ntx_local_password@db:5432/ntx_dev"
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
    # Clear the local runserver command and use the production image CMD
    # (Gunicorn) instead.
    command: null
