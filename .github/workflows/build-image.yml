# Build and publish the container image to GitHub Container Registry.
name: Build image

on:
  push:
    branches:
      - develop
  workflow_dispatch:

# Deny all token scopes by default. The build job grants only what it needs.
permissions: {}

jobs:
  build-push-verify:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # No later step pushes to git, so do not leave credentials in checkout.
          persist-credentials: false

      - name: Set image name
        run: |
          # Docker image names must be lowercase; the GitHub owner may not be.
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          # Use a ref-based tag for manual branch tests without overwriting main.
          echo "REF_TAG=${GITHUB_REF_NAME//\//_}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          # Publish the image, not the local dev target.
          target: cloud
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ env.REF_TAG }}

      - name: Verify the image starts as non-root and not as any other user known to the container (ie. 1000=app)
        run: |
          docker pull "${IMAGE_NAME}:${GITHUB_SHA}"
          set +e
          timeout 7 docker run --rm \
            -u 1001:0 \
            -p 8000:8000 \
            -e DJANGO_SECRET_KEY=ci-smoke \
            -e ALLOWED_HOSTS=localhost \
            -e DATABASE_URL=sqlite:////tmp/smoke.sqlite3 \
            "${IMAGE_NAME}:${GITHUB_SHA}"
          status="$?"
          set -e

          # Gunicorn should still be running when timeout stops the smoke test.
          if [ "$status" -ne 124 ]; then
            echo "Expected the container to keep running until timeout, got exit status $status."
            exit 1
          fi
