# Build and test the container image. Pushing to develop and manual runs
# also publish the verified image to GitHub Container Registry;
# pull requests only build and verify.
name: Build image

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Supersede stale PR runs, but let every publishing run finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Deny all token scopes by default. The build job grants only what it needs.
permissions: {}

jobs:
  build-push-verify:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # No later step pushes to git, so do not leave credentials in checkout.
          persist-credentials: false

      - name: Set image name
        run: |
          # Docker image names must be lowercase; the GitHub owner may not be.
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          # Use a ref-based tag for manual branch tests without overwriting main.
          echo "REF_TAG=${GITHUB_REF_NAME//\//_}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          target: cloud
          platforms: linux/amd64
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ env.REF_TAG }}

      - name: Verify Django serves requests under an arbitrary UID
        timeout-minutes: 2
        run: |
          trap 'docker logs ntx-smoke; docker rm -f ntx-smoke > /dev/null' EXIT

          docker run -d --name ntx-smoke --pull=never \
            -u 1001:0 \
            -p 127.0.0.1:8000:8000 \
            -e DJANGO_SECRET_KEY=ci-smoke \
            -e ALLOWED_HOSTS=localhost \
            -e DATABASE_URL=sqlite:////tmp/smoke.sqlite3 \
            -e EMAIL_HOST=smtp.invalid \
            -e EMAIL_HOST_USER=ci-smoke \
            -e EMAIL_HOST_PASSWORD=ci-smoke \
            -e DEFAULT_FROM_EMAIL=noreply@example.invalid \
            -e DJANGO_SUPERUSER_USERNAME=ci-admin \
            -e DJANGO_SUPERUSER_PASSWORD="${GITHUB_SHA}" \
            "${IMAGE_NAME}:${GITHUB_SHA}"

          # Retry until gunicorn accepts connections and Django answers with 2xx.
          curl --fail --silent --show-error --output /dev/null \
            --retry 60 --retry-delay 1 --retry-max-time 60 --retry-all-errors \
            --max-time 2 \
            http://localhost:8000/accounts/login/

      - name: Push verified image
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:${REF_TAG}"
