# Build and publish the container image to GitHub Container Registry.
name: Build image

on:
  push:
    branches:
      - develop
      - its_openshift
  workflow_dispatch:

# Deny all token scopes by default. The build job grants only what it needs.
permissions: {}

jobs:
  build-push-verify:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # No later step pushes to git, so do not leave credentials in checkout.
          persist-credentials: false

      - name: Set image name
        run: |
          # Docker image names must be lowercase; the GitHub owner may not be.
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          # Use a ref-based tag for manual branch tests without overwriting main.
          echo "REF_TAG=${GITHUB_REF_NAME//\//_}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          # Publish the image, not the local dev target.
          target: cloud
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ env.REF_TAG }}

      - name: Verify the image starts as non-root and not as any other user known to the container (ie. 1000=app)
        run: |
          docker pull "${IMAGE_NAME}:${GITHUB_SHA}"
          set +e
          timeout 7 docker run --rm \
            -u 1001:0 \
            -p 8000:8000 \
            -e DJANGO_SECRET_KEY=ci-smoke \
            -e ALLOWED_HOSTS=localhost \
            -e DATABASE_URL=sqlite:////tmp/smoke.sqlite3 \
            -e DJANGO_SUPERUSER_USERNAME=ci-admin \
            -e DJANGO_SUPERUSER_PASSWORD="${GITHUB_SHA}" \
            "${IMAGE_NAME}:${GITHUB_SHA}"
          status="$?"
          set -e

          # Gunicorn should still be running when timeout stops the smoke test.
          if [ "$status" -ne 124 ]; then
            echo "Expected the container to keep running until timeout, got exit status $status."
            exit 1
          fi
  update-deployment:
    needs: build-push-verify
    runs-on: ubuntu-latest
    # Only fires on your isolated test branch - never touches develop pushes
    if: github.ref == 'refs/heads/its_openshift'
    permissions:
      contents: read
    steps:
      - name: Checkout deployment repo
        uses: actions/checkout@v6
        with:
          repository: UtrechtUniversity/ntx-k8s
          ssh-key: ${{ secrets.DEPLOY_REPO_SSH_KEY }}
          ref: develop

      - name: Set up yq
        uses: mikefarah/yq@v4

      - name: Update image tag
        run: |
          yq e -i '.spec.template.spec.containers[0].image = "ghcr.io/utrechtuniversity/ntx:${{ github.sha }}"' ntx/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ntx/deployment.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: deploy ntx@${{ github.sha }} [skip ci]"
            git push
          fi
