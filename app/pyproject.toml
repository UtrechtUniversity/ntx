[tool.ruff]
line-length = 100
indent-width = 4
# Don't check/format auto-generated Django migrations
exclude = ["**/migrations/**"]

[tool.ruff.lint]
# Basic checks + imports + Django-specific rules
select = ["E", "F", "I", "DJ"]

[tool.ruff.format]
# Use double quotes by default
# The formatter will automatically:
# - Use double quotes for docstrings (PEP 257)
# - Use double quotes for triple-quoted strings (PEP 8)
# - Switch to single quotes when it avoids escaping
quote-style = "double"
indent-style = "space"
docstring-code-format = true
line-ending = "lf"

[tool.pyright]
include = [
    "manage.py",
    "ntx",
    "ntx_users",
    "ntxconfig",
]
exclude = [
    "**/migrations",
    "**/__pycache__",
]
defineConstant = { DEBUG = true }

reportMissingImports = "error"

pythonVersion = "3.14"
pythonPlatform = "Linux"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "ntxconfig.settings.local"
testpaths = ["ntx", "ntx_users"]
python_files = ["test_*.py"]
