{% extends "ntx/base.html" %}

{% block title %}Log in | Neurotoxicology{% endblock %}

{% block content %}
  <div class="max-w-md">
    <h2 class="text-2xl font-semibold tracking-tight text-slate-900 mb-3">Log in</h2>
    <form method="post" class="auth-form flex flex-col gap-4">
      {% csrf_token %}
      {{ form.as_div }}
      <input type="hidden" name="next" value="{{ next }}">
      <button
        type="submit"
        class="self-start px-4 py-2 rounded-xl bg-slate-900 text-white text-sm font-medium hover:bg-slate-700"
      >
        Log in
      </button>
      <a href="{% url 'password_reset' %}" class="underline">Forgotten your password?</a>
    </form>
  </div>
{% endblock %}
