{% extends "ntx/base.html" %}

{% block title %}Reset password | Neurotoxicology{% endblock %}

{% block content %}
  <div class="max-w-md">
    <h2 class="text-2xl font-semibold tracking-tight text-slate-900 mb-3">Reset password</h2>
    <p class="text-slate-600 mb-6">
      Forgotten your password? Enter your email address below, and we'll email instructions for setting a new one.
    </p>

    <form method="post" class="auth-form flex flex-col gap-4">
      {% csrf_token %}
      {{ form.as_div }}
      <button
        type="submit"
        class="self-start px-4 py-2 rounded-xl bg-slate-900 text-white text-sm font-medium hover:bg-slate-700"
      >
        Reset my password
      </button>
    </form>
  </div>
{% endblock %}
