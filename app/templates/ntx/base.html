{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}Neurotoxicology{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div class="max-w-6xl w-full mx-auto min-h-screen flex flex-col gap-6 px-6 py-8">
      <header class="bg-white/80 backdrop-blur border border-slate-200 shadow-sm rounded-2xl">
        <div class="px-6 py-5 text-center">
          <h1 class="text-2xl md:text-3xl font-semibold tracking-tight text-slate-900">Neurotoxicology</h1>
        </div>
      </header>

      <main class="flex-1 w-full">
        <div class="bg-white/80 backdrop-blur border border-slate-200 shadow-sm rounded-2xl px-6 py-8">
          {% block content %}{% endblock %}
        </div>
      </main>

      <footer class="bg-white/80 backdrop-blur border border-slate-200 shadow-sm rounded-2xl">
        <div class="px-6 py-4 text-center text-sm text-slate-600">
          <p>{% now "Y" %} Neurotoxicology Research Group</p>
        </div>
      </footer>
    </div>
  </body>
</html>
